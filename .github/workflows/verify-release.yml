name: Verify release assets

# Publishing is not done when the artifact is uploaded. It is done when a
# fresh project can resolve it. RELEASING.md has the four failures that
# produced that sentence; all four were in the last hop rather than the
# work, and all four were green from this side.
#
# They were invisible because we checked as publishers - the API listing
# showed the asset and we called it done.
#
# The API listing is NOT sufficient on its own: an asset can report
# state=uploaded with a valid browser_download_url while still returning
# 404, for roughly fifteen seconds after upload. So this downloads.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify"
        required: true

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch every expected asset as a consumer would
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -u
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # A jar alone is not a usable release: without the descriptor a
          # consumer silently gets whatever BouncyCastle is already on their
          # classpath, and ML-DSA fails at runtime with NoClassDefFoundError.
          expected=(
            "activeledger-${version}.jar"
            "activeledger-${version}.pom"
            "ivy-${version}.xml"
          )

          failed=0
          for asset in "${expected[@]}"; do
            # Retry: an asset can 404 briefly after upload while the CDN
            # catches up. Six tries over a minute is well clear of what we
            # have measured.
            for attempt in $(seq 1 6); do
              code=$(curl -sL -o /tmp/asset -w "%{http_code}" "${base}/${asset}")
              [ "$code" = "200" ] && break
              sleep 10
            done

            size=$(stat -c%s /tmp/asset 2>/dev/null || echo 0)
            if [ "$code" != "200" ] || [ "$size" -lt 100 ]; then
              echo "::error::${asset} is not downloadable (http ${code}, ${size} bytes)"
              failed=1
            else
              echo "ok  ${asset}  (${size} bytes)"
            fi
          done

          # The descriptor existing is not enough - it has to carry the
          # dependency declarations, which is the entire reason it is there.
          curl -sL -o /tmp/ivy.xml "${base}/ivy-${version}.xml" || true
          if ! grep -q 'name="bcprov-jdk18on"' /tmp/ivy.xml 2>/dev/null; then
            echo "::error::ivy-${version}.xml does not declare bcprov-jdk18on"
            failed=1
          else
            echo "ok  ivy declares $(grep -o 'name="bcprov-jdk18on" rev="[^\"]*"' /tmp/ivy.xml)"
          fi

          exit $failed

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/checkout@v4

      # Fetching the bytes is not enough, and this is the lesson of four
      # separate failures: a descriptor can serve a clean 200, carry the
      # right organisation and the right dependency list, and still be
      # unusable. The ivy.xml we publish is a stub with an empty
      # <configurations/> that Gradle refuses to parse on its own.
      #
      # So resolve the coordinate the way a consumer does, and assert the
      # dependencies actually arrive. A missing one is a
      # NoClassDefFoundError in someone's application, never a failure here.
      - name: Resolve the published coordinate as a consumer
        working-directory: .github/consumer-check
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gradle --no-daemon -PsdkVersion="${TAG#v}" verifyResolution
